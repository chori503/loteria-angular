<div class="app-loading" *ngIf="isAppLoading">
    <div class="spinner"></div>
    <p style="color: white;">Cargando cartas...</p>
</div>

<main *ngIf="!isAppLoading" class="main-container">

    <!-- CARD INICIO -->
    <nz-card class="card-start" *ngIf="!startGame" [nzExtra]="extraTemplate">

        <div nz-row>
            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24" style="text-align: center;">

                <button nz-button nzType="primary" class="btn second" (click)="funStartGame()">
                    Comenzar Juego!
                </button>

            </div>
        </div>
    </nz-card>

    <!-- CARD JUEGO -->
    <nz-card class="card-game" *ngIf="!finishedGame && startGame" [nzExtra]="extraTemplate">

        <div nz-row>
            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
                <img [src]="cardImgNameSelected" alt="" class="img-fluid">
            </div>

            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">

                <h1 class="card-name">
                    {{ cardNameSelected }}
                </h1>

                <nz-progress nzType="circle" [nzPercent]="percent.toString()" class="img-fluid" [nzWidth]="300"
                    [nzStrokeColor]="{ '0%': '#108ee9', '100%': '#87d068' }" [nzFormat]="formatProgressBarToSeconds">
                </nz-progress>

                <p [innerHTML]="loteriaScript" style="text-align: center; margin-top: 25px; font-size: 27px;">
                </p>

            </div>
        </div>

        <div nz-row>
            <div nz-col [nzXs]="24" style="text-align: center;">
                <button nz-button nzType="primary" class="btn second" (click)="showModal()">
                    ¡Loteria!
                </button>
            </div>
        </div>

        <!-- MODAL LOTERIA -->
        <!-- Modal to see cards after press button Loteria! -->
        <nz-modal [(nzVisible)]="modalVisible" nzTitle="¡Loteria!" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()"
            [nzOkLoading]="isModalLoading" nzWidth="95vw">

            <div nz-row>
                <div nz-col [nzXs]="24" [nzSm]="18" [nzMd]="12" [nzLg]="12">

                    <label style="font-weight: bold;">Buscar:</label><br><br>

                    <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Escribe el nombre de la carta"
                        style="width: 100%;">

                        <nz-option *ngFor="let card of discoveredCards"
                            nzLabel="{{card.name?.replace('á','a')?.replace('Á','A')?.replace('é','e')?.replace('É','E')?.replace('í','i')?.replace('Í','I')?.replace('ó','o')?.replace('Ó','O')?.replace('ú','u')?.replace('Ú','U')}}"
                            nzValue="{{card.id}}"></nz-option>

                    </nz-select>

                </div>
            </div>
            <div>
                <br>
                <p>Verificar Tablero:</p>
                <div nz-row [nzGutter]="[8, 8]">
                    <div nz-col *ngFor="let table of loteriaTables">
                        <button nz-button
                            [style.background-color]="tableResults[table.id] === true ? '#52c41a' : tableResults[table.id] === false ? '#ff4d4f' : ''"
                            [style.border-color]="tableResults[table.id] === true ? '#52c41a' : tableResults[table.id] === false ? '#ff4d4f' : ''"
                            [style.color]="tableResults[table.id] !== null && tableResults[table.id] !== undefined ? 'white' : ''"
                            (click)="evaluateTable(table)">
                            Tablero {{ table.id }}
                        </button>
                    </div>
                </div>
            </div>
            <div nz-row>
                <div nz-col [nzXs]="24" [nzSm]="8" [nzMd]="4" [nzLg]="4" *ngFor="let card of discoveredCards">

                    <img src="./assets/img/cards/{{card.imageName}}" alt="" class="img-fluid">

                </div>
            </div>
        </nz-modal>
    </nz-card>

    <!-- CARD GANASTE -->
    <nz-card class="card-finish" *ngIf="finishedGame">

        <div class="celebration-container" *ngIf="isCelebrating"></div>

        <h1 class="text-center card-name">
            ¡Ganaste!
        </h1>

        <div nz-row>
            <div nz-col [nzXs]="24" [nzMd]="12">
                <img src="./assets/img/celebrate3.gif" alt="" class="img-fluid" style="border-radius: 16px;">
            </div>

            <div nz-col [nzXs]="24" [nzMd]="12" class="centerHV">

                <button nz-button nzType="primary" class="btn second" (click)="resetGame()">
                    Volver a jugar
                </button>

            </div>
        </div>
    </nz-card>

    <!-- ICON SETTINGS -->
    <ng-template #extraTemplate>
        <span nz-icon nzType="setting" nzTheme="twotone" style="cursor: pointer; font-size: 36px;"
            (click)="showSettingsModal()">
        </span>
    </ng-template>

    <!-- MODAL SETTINGS -->
    <nz-modal [(nzVisible)]="isModalSettingsVisible" nzTitle="Settings" (nzOnCancel)="settingModalCancel()"
        (nzOnOk)="settingModalOk()" (nzAfterOpen)="focusMaxTimeInput()">

        <ng-container *nzModalContent>
            <form nz-form>
                <nz-form-item>
                    <nz-form-label [nzSpan]="24">
                        Duración de segundos:
                    </nz-form-label>

                    <nz-input-number #maxTimeInput name="maxTime" [nzSize]="'large'" [(ngModel)]="maxTime" [nzMin]="1"
                        [nzMax]="30" [nzStep]="1" style="width: 100%;" (keyup.enter)="settingModalOk()">
                    </nz-input-number>

                </nz-form-item>
            </form>
        </ng-container>
    </nz-modal>

</main>
