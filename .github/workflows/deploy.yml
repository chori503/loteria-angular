# Compila y publica la app en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez; si llega un push nuevo, se cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - run: npx ng build --base-href /loteria-angular/

      # GitHub Pages no conoce las rutas de Angular: 404.html = index.html
      # para que recargar /loteria-angular/index no dé 404
      - run: cp dist/loteria/index.html dist/loteria/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/loteria

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
